version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      # Hard Constraint: daily for security updates (not weekly)
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      python-minor:
        update-types:
          - "minor"
    # Hard Constraint: ignore patch/minor updates for dev dependencies
    # (reduce noise; only group minor updates for runtime deps above)
    ignore:
      - dependency-name: "ruff"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "mypy"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "black"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "pytest"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "pytest-cov"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "pytest-mock"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "pytest-randomly"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "pytest-benchmark"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "pre-commit"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "coverage"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "radon"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "bandit"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "pip-audit"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "hypothesis"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "freezegun"
        update-types: ["version-update:semver-patch"]
    # reviewers:
    #   - "<your-github-username>"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor:
        update-types:
          - "minor"
          - "patch"
